<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button id="btnDarkMode" onclick="toggleDarkMode()" style="width: auto; margin-bottom: 20px;">🌙 Modo Oscuro</button>
    <h1>Formulario de Registro</h1>
    <div class="container">
        <form id="registroForm">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" placeholder="Nombre:" required>

            <label for="correo">Correo:</label>
            <input type="email" id="correo" placeholder="Email:" required>

            <label for="telefono">Teléfono:</label>
<input type="tel" id="telefono" placeholder="Ej: 987654321" maxlength="9" required>

            <label for="curso">Curso:</label>
            <select id="curso">
                <option value="Fullstack">Fullstack</option>
                <option value="IA">IA</option>
                <option value="Data Science">Data Science</option>
            </select>

            <button type="button" onclick="registrarEstudiante()">Registrar</button>
        </form>
    </div>

    <div class="lista-container">
        <h2>Estudiantes Registrados</h2>
        <ol id="listaEstudiantes"></ol>
    </div>

    <script src="script.js"></script>
</body>
</html>
